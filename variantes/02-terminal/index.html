<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantia · Terminal</title>
<!-- Variante 02: terminal de mesa (inspiração Bloomberg). Linha de comando, teclas de função, cotações correndo,
     painéis colados com barra de título e tudo em fonte mono. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../padrao/base.css">
<link rel="stylesheet" href="../../padrao/painel.css">
<link rel="stylesheet" href="../_nucleo/nucleo.css">
<link rel="stylesheet" href="tema.css">
<script>try { if (localStorage.getItem("quantia-tema") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
<script>window.QUANTIA_VARIANTE = { teclas: true, aoVivo: true };</script>
</head>
<body data-variante="Terminal">
<div class="term">
  <header class="t-topo">
    <a class="t-marca" href="../../index.html">QUANTIA</a>
    <form class="t-cmd" data-q="cmd" role="search" autocomplete="off">
      <label for="cmd" class="t-prompt">CMD&gt;</label>
      <input id="cmd" name="cmd" placeholder="PLD, NEN, BAND, RISK… ou 1–7" spellcheck="false">
      <button type="submit">GO</button>
      <span class="cmd-msg" aria-live="polite"></span>
    </form>
    <span class="t-pg"><b data-q="cod"></b> <span data-q="titulo"></span></span>
    <span class="t-hora"><span class="t-vivo">● SIMULADO</span> <span class="num" data-q="relogio"></span> BRT</span>
    <button class="t-btn" type="button" data-q="tema">Tema claro</button>
  </header>
  <nav class="t-fn" data-q="nav" aria-label="Funções"></nav>
  <div class="t-ticker" data-q="ticker" aria-label="Cotações simuladas"></div>
  <main class="t-main" data-q="conteudo"></main>
  <footer class="t-status">
    <span>DADOS FICTÍCIOS</span><span>RODADA 15/11/26 06:10</span><span class="t-atalhos">1–7 PÁGINAS · / COMANDO · T TEMA</span>
  </footer>
</div>
<script src="../../padrao/graficos.js"></script>
<script src="../_nucleo/ficticio.js"></script>
<script src="../_nucleo/nucleo.js"></script>
</body>
</html>
